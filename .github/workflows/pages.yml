name: Publish project site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'public/assets/**'
      - 'scripts/*pages*'
      - 'DeepMoveBot/**.md'
      - 'DeepMoveBot/docs/**'
      - 'DeepSpeedBot/**.md'
      - 'DeepSpeedBot/docs/**'
      - '*.md'
      - 'LICENSE'
      - 'package*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build static landing and documentation
        run: npm run build:pages
      - name: Validate links and public artifact
        run: npm run check:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy project site
        id: deployment
        uses: actions/deploy-pages@v4
