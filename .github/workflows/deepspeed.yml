name: DeepSpeedBot
on:
  push:
    paths: ['DeepSpeedBot/**', '.github/workflows/deepspeed.yml']
  pull_request:
    paths: ['DeepSpeedBot/**', '.github/workflows/deepspeed.yml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cmake -S DeepSpeedBot -B DeepSpeedBot/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build DeepSpeedBot/build --config Release --parallel
      - run: ctest --test-dir DeepSpeedBot/build -C Release --output-on-failure
      - name: Put multi-config Windows binary at the documented path
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item -LiteralPath DeepSpeedBot/build/Release/deepspeed.exe -Destination DeepSpeedBot/build/deepspeed.exe
      - run: python -m unittest discover -s DeepSpeedBot/tests -p test_protocol.py -v
      - run: python -m pip install -r DeepSpeedBot/tests/requirements.txt
      - run: python DeepSpeedBot/tests/differential.py
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S DeepSpeedBot -B DeepSpeedBot/build-asan -DCMAKE_BUILD_TYPE=Debug -DDEEPSPEED_SANITIZE=ON
      - run: cmake --build DeepSpeedBot/build-asan --parallel
      - run: ctest --test-dir DeepSpeedBot/build-asan --output-on-failure
