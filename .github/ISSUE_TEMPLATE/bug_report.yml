name: Ошибка
description: Сообщить о воспроизводимой проблеме DeepMove
body:
  - type: markdown
    attributes:
      value: Не публикуй ключи, пароли, cookie или пользовательскую БД. Для уязвимостей смотри SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Что произошло?
      description: Ожидаемый и фактический результат.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить?
      description: Шаги, версия/commit, формат партии. Для интерфейса можно приложить скриншот.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      placeholder: ОС, браузер, Node.js / Python, режим игры
