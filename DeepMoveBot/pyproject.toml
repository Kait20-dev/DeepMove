[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepmove-bot"
version = "0.1.0"
description = "An educational handcrafted chess engine and DeepMove arena connector"
requires-python = ">=3.10"
dependencies = ["chess==1.11.2"]
readme = "README.md"

[project.scripts]
deepmove-bot = "deepmove_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
