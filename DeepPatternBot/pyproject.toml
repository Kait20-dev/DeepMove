[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deeppattern-bot"
version = "0.1.0"
description = "Streaming PGN index, statistical move policy and supervised chess evaluator"
requires-python = ">=3.10"
dependencies = ["deepmove-botkit==0.1.0"]
readme = "README.md"

[project.scripts]
deeppattern-bot = "deeppattern_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
